esphome:
  name: fv2
  friendly_name: FV2

external_components:
  # 
  - source: github://gareth-ellis/esphome-districtheating@dev
    components: [esphome-components]


esp8266:
  board: d1_mini_lite

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "<suitable_key>"

ota:
  - platform: esphome
    password: "<suitable_password>"

uart:
  - id: uart_in
    rx_pin: RX
    baud_rate: 2400
    data_bits: 7
    parity: EVEN
    stop_bits: 2
    rx_buffer_size: 2048
  - id: uart_out
    tx_pin: D1
    baud_rate: 300
    data_bits: 7
    parity: EVEN
    stop_bits: 2
mqtt:
  broker: <suitable_broker_address>
  username: <suitable_username>
  password: <suitable_password
  discovery: True
  
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fv2 Fallback Hotspot"
    password: "<suitable_password>"

captive_portal:
    